#!/usr/bin/env -S ansible-playbook
---

- name: Setup GitLab OpenSearch
  hosts: gitos
  gather_facts: true
  tasks:
    - name: Add OpenSearch apt repository
      ansible.builtin.deb822_repository:
        name: opensearch
        types: deb
        uris: https://artifacts.opensearch.org/releases/bundle/opensearch/3.x/apt
        suites: stable
        components: main
        signed_by: https://artifacts.opensearch.org/publickeys/opensearch-release.pgp

    - name: Install OpenSearch package
      ansible.builtin.apt:
        name: opensearch
        state: present
        update_cache: true
      environment:
        DISABLE_INSTALL_DEMO_CONFIG: "true"
        DISABLE_SECURITY_PLUGIN: "true"

    - name: Configure OpenSearch
      ansible.builtin.copy:
        dest: /etc/opensearch/opensearch.yml
        content: |
          cluster.name: gitlab
          node.name: {{ inventory_hostname }}
          network.host: 0.0.0.0
          http.port: 9200
          discovery.type: single-node
          plugins.security.disabled: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart opensearch

    - name: Configure OpenSearch heap size
      ansible.builtin.copy:
        dest: /etc/opensearch/jvm.options.d/heap.options
        content: |
          -Xms{{ opensearch_heap_size }}
          -Xmx{{ opensearch_heap_size }}
        owner: root
        group: root
        mode: "0644"
      notify: Restart opensearch

    - name: Enable and start OpenSearch
      ansible.builtin.systemd:
        name: opensearch
        enabled: true
        state: started

    - name: Wait for OpenSearch to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/
        status_code: 200
      register: opensearch_ready
      retries: 10
      delay: 3
      until: opensearch_ready.status == 200

    - name: Apply default index template
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_index_template/default
        method: PUT
        body: "{{ lookup('file', repo_base_dir + '/files/gitos/index_defaults') }}"
        body_format: json
        status_code: 200
  roles:
    - role: elastic_exporter
      tags: ["elastic_exporter"]
  handlers:
    - name: Restart opensearch
      ansible.builtin.systemd:
        name: opensearch
        state: restarted

- name: Setup Gitlab
  hosts: gitlab
  gather_facts: true
  roles:
    - role: geerlingguy.gitlab
      tags: ["gitlab"]

    - role: systemd
      tags: ["systemd"]

  tasks:
    - name: Ensure gitlab SSL dir exists
      ansible.builtin.file:
        path: /etc/gitlab/ssl
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: ["pg_cert", "ssl"]

  post_tasks:
    # Required for gitlab backup to work
    - name: Ensure tar is installed
      ansible.builtin.package:
        name: tar
        state: present

    - name: Ensure git owns backup mount
      ansible.builtin.file:
        path: "{{ gitlab_backup_upload_connection.local_root }}"
        owner: git
        group: git
        mode: "0750"
        state: directory
      tags: ["gitlab"]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

- name: Setup Gitlab runners
  hosts: gitrun
  pre_tasks:
    - name: Setup podman runner
      tags: ["podman"]
      block:
        # Package sets it up, but it won't be installed when running from scratch
        - name: Ensure runner user exists
          ansible.builtin.user:
            name: gitlab-runner
            system: true
            state: present
          register: __runner_user
          tags: ["runner"]

        - name: Configure runner authorized_keys
          ansible.posix.authorized_key:
            user: "gitlab-runner"
            key: "{{ ssh_authorized_keys | join('\n') }}"
            state: present
            exclusive: true

        - name: Setup rootless podman
          ansible.builtin.copy:
            content: |
              gitlab-runner:100000:65536
            dest: "{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - "/etc/subuid"
            - "/etc/subgid"

        - name: Install packages
          ansible.builtin.package:
            name:
              - fuse-overlayfs
              - podman
              - python3-podman
            state: present

        - name: Install podman-plugins
          ansible.builtin.dnf:
            name: podman-plugins
            state: present
          when: ansible_facts.os_family == 'RedHat'

        - name: Get user status
          ansible.builtin.command:
            cmd: loginctl show-user gitlab-runner
          changed_when: false
          check_mode: false
          failed_when: false
          register: __user_status

        - name: Enable linger  # noqa no-changed-when - when
          ansible.builtin.command:
            cmd: loginctl enable-linger gitlab-runner
          when: "'Linger=yes' not in __user_status.stdout or 'not logged in or lingering' in __user_status.stderr"
          notify: Reboot

        - name: Enable and start user socket
          become: false
          vars:
            # become + become_user doesn't start a systemd session
            ansible_ssh_user: gitlab-runner
          ansible.builtin.systemd:
            name: podman.socket
            state: started
            enabled: true
            scope: user

        - name: Set socket path fact
          ansible.builtin.set_fact:
            podman_user_socket: "unix:///run/user/{{ __runner_user.uid }}/podman/podman.sock"
          tags: ["runner"]

  roles:
    - role: geerlingguy.docker
      tags: ["docker"]

    - role: gitlab_runner
      tags: ["runner"]

  post_tasks:
    - name: Add automatic docker prune job
      ansible.builtin.copy:
        src: "{{ repo_base_dir }}/files/gitlab/docker-auto-prune.timer"
        dest: "/etc/systemd/system/docker-auto-prune.timer"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Enable and start automatic docker prune
      tags: ["docker", "prune"]

    - name: Copy automatic docker prune service
      ansible.builtin.copy:
        src: "{{ repo_base_dir }}/files/gitlab/docker-auto-prune.service"
        dest: "/etc/systemd/system/docker-auto-prune.service"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      tags: ["docker", "prune"]

    - name: Add automatic podman prune job
      ansible.builtin.copy:
        src: "{{ repo_base_dir }}/files/gitlab/podman-auto-prune.timer"
        dest: "/etc/systemd/system/podman-auto-prune.timer"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Enable and start automatic podman prune
      tags: ["podman", "prune"]

    - name: Copy automatic podman prune service
      ansible.builtin.copy:
        src: "{{ repo_base_dir }}/files/gitlab/podman-auto-prune.service"
        dest: "/etc/systemd/system/podman-auto-prune.service"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
      tags: ["podman", "prune"]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start automatic docker prune
      ansible.builtin.systemd:
        name: docker-auto-prune.timer
        state: started
        enabled: true

    - name: Enable and start automatic podman prune
      ansible.builtin.systemd:
        name: podman-auto-prune.timer
        state: started
        enabled: true

    - name: Reboot
      ansible.builtin.reboot:
