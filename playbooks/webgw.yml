#!/usr/bin/env -S ansible-playbook
---

- name: Configure SSH
  hosts: webgw
  gather_facts: false
  pre_tasks:
    - name: Check if we can connect on configured port
      ansible.builtin.wait_for:
        port: "{{ ansible_port }}"
        state: "started"
        host: "{{ ansible_host }}"
        connect_timeout: 2
        timeout: 4
      delegate_to: "localhost"
      ignore_errors: true
      check_mode: false
      register: __configured_ssh
      tags: ["sshd"]

  roles:
    - role: change_ssh_port
      when:
        - ansible_port != 22
        - __configured_ssh is defined
        - __configured_ssh.state is undefined
      tags: ["sshd"]

- name: Configure user
  hosts: webgw
  gather_facts: false
  tasks:
    - name: Include user tasks
      ansible.builtin.include_tasks:
        file: ../tasks/configure_ssh_user.yml
      vars:
        ssh_host_check: "{{ ansible_ssh_host }}"
        user_passwordless_sudo: true
        user_groups: ["sudo"]
      tags: ["user"]

- name: Configure gateways
  hosts: webgw
  gather_facts: true
  pre_tasks:
    - name: Set fail2ban facts
      ansible.builtin.set_fact:
        fail2ban_ignoreip: "{{ (__f2b_extra_ignore + hostvars['laptop'].wireguard_mt_allowed_ips) | flatten }}"
      tags: ["fail2ban"]

    - name: Include common tasks
      ansible.builtin.include_tasks:
        file: ../tasks/common_servers.yml
      tags: ["always"]

    - name: Create /etc/ssl/localcerts
      ansible.builtin.file:
        path: /etc/ssl/localcerts
        owner: root
        group: root
        mode: "0755"
        state: directory
      when: ownca_cert_list is defined
      tags: ["ownca"]

    - name: Copy Crowdsec public key
      ansible.builtin.copy:
        src: "{{ ownca_cert_list[0].publickey_path }}"
        dest: "{{ crowdsec_api_server_tls.cert_file }}"
        owner: root
        group: root
        mode: "0644"
      when:
        - ownca_cert_list is defined
        - crowdsec_api_server_tls is defined
      tags: ["ownca"]

    - name: Copy Crowdsec private key
      ansible.builtin.copy:
        src: "{{ ownca_cert_list[0].privatekey_path }}"
        dest: "{{ crowdsec_api_server_tls.key_file }}"
        owner: root
        group: root
        mode: "0600"
      when:
        - ownca_cert_list is defined
        - crowdsec_api_server_tls is defined
      tags: ["ownca"]
  roles:
    - role: ownca
      tags: ["ownca"]
      when:
        - ownca_cert_list is defined
        - "'generate' in ansible_run_tags"

    - role: wireguard
      when: wireguard_addresses is defined
      tags: ["wireguard"]

    - role: fail2ban
      tags: ["fail2ban"]

    - role: auto_ssh
      when: ssh_dest_hosts | default([]) | length > 0
      tags: ["auto-ssh"]

    - role: lego
      tags: ["lego"]
      when:
        - lego_certificates is defined
        - lego_certificates | length > 0

    - role: nginx_pre
      tags: ["nginx"]

    - role: nginx
      tags: ["nginx"]

    - role: nginx_exporter
      tags: ["nginx_exporter"]

    - role: postfix_exporter
      tags: ["postfix_exporter"]
      when: postfix_exporter_port is defined
