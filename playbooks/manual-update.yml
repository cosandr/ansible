#!/usr/bin/env -S ansible-playbook
---

- name: Upgrade OS with apt
  hosts: servers, !romsto, !syno, !udr7
  gather_facts: true
  become: true
  strategy: free
  tasks:
    - name: Upgrade with apt
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      register: __apt_result
      notify: Reboot

    # Even though dist-upgrade is used, old kernel versions remain, filling up /boot
    # autoremove cleans them up
    - name: Autoclean/remove with apt
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
      tags: ["autoremove"]
      register: __autoremove_result

    - name: Print apt results
      ansible.builtin.debug:
        msg: "{{ __apt_result.stdout_lines }}"
      when:
        - __apt_result is defined
        - __apt_result.stdout_lines | default([]) | length > 0

    - name: Print autoremove results
      ansible.builtin.debug:
        msg: "{{ __autoremove_result.stdout_lines }}"
      tags: ["autoremove"]
      when:
        - __autoremove_result is defined
        - __autoremove_result is changed
        - __autoremove_result.stdout_lines | default([]) | length > 0

  handlers:
    - name: Reboot
      ansible.builtin.reboot:
      when: auto_reboot | default(false) | bool
