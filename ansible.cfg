[ssh_connection]
pipelining=True
ansible_ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null

[defaults]
collections_path = ./
roles_path = roles
inventory = inventory
vault_password_file = gopass-vault.sh
gathering = smart
library = ./library
module_utils = ./module_utils
host_key_checking = False
force_handlers = True
forks = 50
# TODO: remove once non-boolean when: sites are fixed for ansible-core 2.19+
allow_broken_conditionals = true

[inventory]
enable_plugins = ini

[passwordstore_lookup]
backend = gopass
