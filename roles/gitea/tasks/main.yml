---

- name: Check vars
  ansible.builtin.assert:
    that:
      - gitea_secret_key | length > 0
      - gitea_internal_token | length > 0
      - gitea_jwt_secret | length > 0
      - gitea_oauth2_jwt_secret | length > 0

- name: Include installation tasks
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: ["install"]
  tags: ["install"]

- name: Install gitea config
  ansible.builtin.template:
    src: "{{ gitea_config_template }}"
    dest: /etc/gitea/app.ini
    owner: root
    group: git
    mode: "0640"
  notify: Restart gitea

- name: Enable and start Gitea systemd service
  ansible.builtin.systemd:
    name: gitea.service
    enabled: true
    state: started
    daemon_reload: true
