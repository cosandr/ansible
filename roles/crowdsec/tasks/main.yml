- name: Configure allowlist
  tags: ["allowlist"]
  when: crowdsec_api_server_enable
  block:
    - name: Get current allowlists
      ansible.builtin.command:
        cmd: "cscli allowlist list -o json"
      changed_when: false
      check_mode: false
      register: __allowlist_list

    - name: Parse current allowlists
      ansible.builtin.set_fact:
        crowdsec_allowlist_list: "{{ __allowlist_list.stdout | from_json }}"

    - name: Set allowlist facts
      ansible.builtin.set_fact:
        # map + difference keeps only name, need full item
        crowdsec_missing_allowlists: >-
          {%- set tmp = [] -%}
          {%- for item in crowdsec_allowlists if item['name'] not in (crowdsec_allowlist_list | map(attribute='name')) -%}
          {{- tmp.append(item) -}}
          {%- endfor -%}
          {{ tmp }}
        crowdsec_extra_allowlist_values: >-
          {%- set tmp = [] -%}
          {%- for item in crowdsec_allowlists -%}
          {%- for actual_item in crowdsec_allowlist_list if actual_item["name"] == item["name"] -%}
          {%- set val_diff = (actual_item["items"] | map(attribute='value')) | difference(item["items"]) -%}
          {%- if val_diff | length > 0 -%}
          {{- tmp.append({"name": item["name"], "items": val_diff}) -}}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ tmp }}

    - name: Create missing allowlists
      ansible.builtin.command:
        argv: ["cscli", "allowlist", "create", "{{ item.name }}", "-d", "{{ item.description }}"]
      register: __out
      changed_when: "'created successfully' in __out.stdout"
      loop: "{{ crowdsec_missing_allowlists }}"

    # Adding all is safe, only what's missing is added
    - name: Add configured values to allowlist
      ansible.builtin.command:
        cmd: "cscli allowlist add {{ item.name }} {{ item['items'] | join(' ') }}"
      register: __out
      changed_when: "'added' in __out.stdout"
      loop: "{{ crowdsec_allowlists }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove extra values from allowlist
      ansible.builtin.command:
        cmd: "cscli allowlist remove {{ item.name }} {{ item['items'] | join(' ') }}"
      register: __out
      changed_when: "'removed' in __out.stdout"
      loop: "{{ crowdsec_extra_allowlist_values }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove extra allowlists
      ansible.builtin.command:
        cmd: "cscli allowlist delete {{ item }}"
      register: __out
      changed_when: "'deleted successfully' in __out.stdout"
      loop: "{{ (crowdsec_allowlist_list | map(attribute='name')) | difference(crowdsec_allowlists | map(attribute='name')) }}"
