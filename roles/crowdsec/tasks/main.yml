---

- name: Add CrowdSec repository (Debian)
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: [deb]
    uris: https://packagecloud.io/crowdsec/crowdsec/any
    suites: [any]
    components: [main]
    signed_by: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    state: present
  when: ansible_facts.os_family == 'Debian'
  tags: ["install"]

- name: Add CrowdSec repository (DNF)
  ansible.builtin.copy:
    dest: "/etc/yum.repos.d/crowdsec_crowdsec.repo"
    owner: "root"
    group: "root"
    mode: "0644"
    content: |
      [crowdsec_crowdsec]
      name=crowdsec_crowdsec
      baseurl=https://packagecloud.io/crowdsec/crowdsec/rpm_any/rpm_any/$basearch
      repo_gpgcheck=1
      gpgcheck=1
      enabled=1
      gpgkey=https://packagecloud.io/crowdsec/crowdsec/gpgkey
             https://packagecloud.io/crowdsec/crowdsec/gpgkey/crowdsec-crowdsec-C822EDD6B39954A1.pub.gpg
             https://packagecloud.io/crowdsec/crowdsec/gpgkey/crowdsec-crowdsec-FED78314A2468CCF.pub.gpg
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=3600
  when: ansible_facts.os_family == 'RedHat'
  tags: ["install"]

- name: Install CrowdSec
  ansible.builtin.package:
    name: crowdsec
    state: present
    # DNF doesn't need this, apt would fail to find package after fresh repo install
    update_cache: "{{ ansible_facts.os_family == 'Debian' }}"
  tags: ["install"]

- name: Install or uninstall firewall bouncer
  ansible.builtin.package:
    name: crowdsec-firewall-bouncer-nftables
    state: "{{ 'present' if crowdsec_firewall_bouncer_installed else 'absent' }}"
  tags: ["install"]

- name: Copy config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/crowdsec/config.yaml
    owner: root
    group: root
    mode: "0600"
    validate: "crowdsec -t -c %s"
  notify: Restart CrowdSec

- name: Configure LAPI credentials
  ansible.builtin.copy:
    content: |
      {{ ansible_managed | comment }}
      {{ crowdsec_local_api_credentials | to_nice_yaml(indent=2) }}
    dest: /etc/crowdsec/local_api_credentials.yaml
    owner: root
    group: root
    mode: "0600"
  when: crowdsec_local_api_credentials | length > 0
  notify: Restart CrowdSec

- name: Ensure CrowdSec is enabled and running
  ansible.builtin.systemd:
    name: crowdsec.service
    enabled: true
    state: started

