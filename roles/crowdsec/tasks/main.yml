- name: Configure collections
  when: crowdsec_collections | length > 0
  tags: ["collections"]
  block:
    - name: Get current collections
      ansible.builtin.command:
        cmd: "cscli collections list -o json"
      changed_when: false
      check_mode: false
      register: __collections_list

    - name: Parse current collections
      ansible.builtin.set_fact:
        crowdsec_collections_list: "{{ (__collections_list.stdout | from_json)['collections'] }}"

    - name: Install missing collections
      ansible.builtin.command:
        cmd: "cscli collections install {{ missing_collections | join(' ') }}"
      register: __output
      changed_when: "'Nothing to install or remove' not in __output.stdout"
      vars:
        missing_collections: "{{ crowdsec_collections | difference(crowdsec_collections_list | map(attribute='name')) }}"
      notify: Restart CrowdSec
      when: missing_collections | length > 0

- name: Sync acquisition files
  ansible.builtin.include_tasks:
    file: sync_d.yml
    apply:
      tags: ["acquis"]
  vars:
    __crowdsec_sync_dir: /etc/crowdsec/acquis.d
    __crowdsec_sync_items: "{{ crowdsec_acquis_d }}"
  tags: ["acquis"]

- name: Sync scenarios
  ansible.builtin.include_tasks:
    file: sync_d.yml
    apply:
      tags: ["scenarios"]
  vars:
    __crowdsec_sync_dir: /etc/crowdsec/scenarios
    __crowdsec_sync_items: "{{ crowdsec_scenarios }}"
  tags: ["scenarios"]

