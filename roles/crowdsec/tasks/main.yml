- name: Configure machines
  tags: ["machines"]
  when: crowdsec_api_server_enable
  block:
    - name: Get current machines
      ansible.builtin.command:
        cmd: "cscli machines list -o json"
      changed_when: false
      check_mode: false
      register: __machines_list

    - name: Parse current machines
      ansible.builtin.set_fact:
        crowdsec_machines_list: "{{ __machines_list.stdout | from_json }}"

    - name: Add missing machines
      ansible.builtin.command:
        cmd: "cscli machine add {{ item.name }} --password {{ item.password }} -f /dev/null"
      register: __output
      changed_when: "'successfully added' in __output.stderr"
      loop: "{{ crowdsec_machines | rejectattr('name', 'in', crowdsec_machines_list | map(attribute='machineId') | list) | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Set facts for machines
      ansible.builtin.set_fact:
        crowdsec_machines_delete: >-
          {%- set tmp = [] -%}
          {%- for m in crowdsec_machines_list if m['machineId'] not in (crowdsec_machines | map(attribute='name')) -%}
          {{- tmp.append(m['machineId']) -}}
          {%- endfor -%}
          {{ tmp }}

    - name: Remove machines not in list
      ansible.builtin.command:
        cmd: "cscli machine delete {{ item }}"
      register: __output
      changed_when: "'deleted successfully' in __output.stderr"
      loop: "{{ crowdsec_machines_delete }}"

