---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload nginx appamor profile # noqa no-changed-when
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/usr.sbin.nginx

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted
