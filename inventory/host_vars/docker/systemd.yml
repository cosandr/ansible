---

systemd_units:
  - name: nvidia-power-limit
    service:
      state: "{{ omit }}"
      enabled: true
      content: |
        [Unit]
        Description=Set Nvidia GPU power limit

        [Service]
        Type=oneshot
        RemainAfterExit=true
        ExecStart=/usr/bin/nvidia-smi -pl 100

        [Install]
        WantedBy=multi-user.target

  - name: docker-auto-start
    service:
      state: "{{ omit }}"
      enabled: true
      content: |
        [Unit]
        Description=Start all Docker containers
        After=network-online.target docker.service
        Requires=network-online.target docker.service

        [Service]
        Type=oneshot
        RemainAfterExit=true
        User={{ my_user }}
        Group={{ my_user }}
        WorkingDirectory=/mnt/containers
        Environment=BUILD=0
        Environment=PULL=1
        Environment=CI=true
        ExecStart=/mnt/containers/run.sh up

        [Install]
        WantedBy=multi-user.target

  - name: docker-auto-prune
    service:
      content: |
        [Unit]
        Description=Prune Docker
        After=docker.service
        Requires=docker.service

        [Service]
        ExecStart=/usr/bin/docker system prune -af

    timer:
      enabled: true
      state: started
      content: |
        [Unit]
        Description=Automatically prune Docker every week

        [Timer]
        OnCalendar=*-*-01,14 08:00:00
        RandomizedDelaySec=15m
        Persistent=true

        [Install]
        WantedBy=timers.target
